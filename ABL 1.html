<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessHub - Login and Register</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #303039;
            background: #e5ebff;
        }

        .view-toggle {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px #26396824;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            color: white;
            background: #718de3;
        }

        .welcome h1 {
            margin: 0 0 12px;
        }

        .welcome p {
            line-height: 1.5;
        }

        .form-panel {
            padding: 40px;
        }

        .form-content {
            max-width: 360px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tabs label {
            flex: 1;
            padding: 10px;
            text-align: center;
            color: #555;
            background: #f0f2f8;
            border-radius: 6px;
            cursor: pointer;
        }

        #login:checked ~ main .tabs label[for="login"],
        #register:checked ~ main .tabs label[for="register"],
        #recover:checked ~ main .tabs label[for="recover"] {
            color: white;
            background: #718de3;
        }

        .form-view {
            display: none;
        }

        #login:checked ~ main #loginForm,
        #register:checked ~ main #registerForm,
        #recover:checked ~ main #recoverForm {
            display: block;
        }

        h2 {
            margin: 0 0 20px;
            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .field input {
            width: 100%;
            padding: 11px;
            border: 1px solid #c9cbd3;
            border-radius: 6px;
            font: inherit;
        }

        .field input:focus {
            border-color: #718de3;
            outline: 2px solid #718de344;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 4px 0 18px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .link,
        .submit-button {
            color: #4f6fc9;
            font: inherit;
            cursor: pointer;
        }

        .link {
            padding: 0;
            border: 0;
            background: none;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            color: white;
            background: #718de3;
        }

        .submit-button:hover {
            background: #5d79cf;
        }

        .switch-text,
        .note {
            text-align: center;
            line-height: 1.5;
        }

        .switch-text {
            margin: 18px 0 0;
            font-size: 14px;
        }

        .note {
            margin: 24px 0 0;
            color: #666;
            font-size: 12px;
        }

        #login:focus-visible ~ main .tabs label[for="login"],
        #register:focus-visible ~ main .tabs label[for="register"],
        #recover:focus-visible ~ main .tabs label[for="recover"] {
            outline: 2px solid #303039;
        }

        @media (max-width: 650px) {
            body {
                padding: 16px;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .welcome {
                padding: 24px;
            }

            .welcome h1 {
                font-size: 24px;
            }

            .form-panel {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <input class="view-toggle" type="radio" name="view" id="login" checked>
    <input class="view-toggle" type="radio" name="view" id="register">
    <input class="view-toggle" type="radio" name="view" id="recover">

    <main class="container">
        <section class="welcome">
            <h1>Welcome to AccessHub</h1>
            <p>Sign in to your account or create a new one to get started.</p>
        </section>

        <section class="form-panel">
            <div class="form-content">
                <nav class="tabs" aria-label="Account options">
                    <label for="login">Login</label>
                    <label for="register">Register</label>
                    <label for="recover">Reset password</label>
                </nav>

                <form id="loginForm" class="form-view" action="#" method="post">
                    <h2>Login</h2>
                    <div class="field">
                        <label for="loginEmail">Username or email</label>
                        <input id="loginEmail" name="username" type="text"
                            autocomplete="username" required>
                    </div>
                    <div class="field">
                        <label for="loginPassword">Password</label>
                        <input id="loginPassword" name="password" type="password"
                            autocomplete="current-password" required>
                    </div>
                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>
                        <label class="link" for="recover">Forgot password?</label>
                    </div>
                    <button class="submit-button" type="submit">Login</button>
                    <p class="switch-text">
                        Don't have an account?
                        <label class="link" for="register">Register</label>
                    </p>
                </form>

                <form id="registerForm" class="form-view" action="#" method="post">
                    <h2>Create an account</h2>
                    <div class="field">
                        <label for="fullName">Full name</label>
                        <input id="fullName" name="name" type="text"
                            autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="registerEmail">Email address</label>
                        <input id="registerEmail" name="email" type="email"
                            autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="registerPassword">Password</label>
                        <input id="registerPassword" name="password" type="password"
                            autocomplete="new-password" minlength="8" required>
                    </div>
                    <button class="submit-button" type="submit">Create account</button>
                    <p class="switch-text">
                        Already have an account?
                        <label class="link" for="login">Login</label>
                    </p>
                </form>

                <form id="recoverForm" class="form-view" action="#" method="post">
                    <h2>Reset password</h2>
                    <p class="switch-text">Enter your email address to request a password reset.</p>
                    <div class="field">
                        <label for="recoverEmail">Email address</label>
                        <input id="recoverEmail" name="email" type="email"
                            autocomplete="email" required>
                    </div>
                    <button class="submit-button" type="submit">Request reset</button>
                    <p class="switch-text">
                        <label class="link" for="login">Back to login</label>
                    </p>
                </form>

                <p class="note">Demo interface only. Authentication requires a server.</p>
            </div>
        </section>
    </main>
</body>
</html>
